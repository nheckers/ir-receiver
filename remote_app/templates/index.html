<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Room Remote</title>

  <!-- Makes it open full screen as an app from the home screen -->
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Remote">
  <meta name="theme-color" content="#0e0e10">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">

  <style>
    :root {
      --bg: #0e0e10;
      --btn: #26262b;
      --btn-press: #3a3a42;
      --ring: #1d1d22;
      --line: #333338;
      --text: #e8e8ea;
      --muted: #8a8a92;
      --power: #8a1f1f;
      --ok: #2c3a58;
      --accent: #6f9cff;
      --tabs-h: 64px;
    }
    * { box-sizing: border-box; }
    html, body {
      /* No double-tap zoom, no text selection, no long-press popups */
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    body {
      margin: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ---------- Remote body ---------- */
    .remote {
      display: none;
      flex-direction: column; align-items: center; gap: 22px;
      max-width: 340px; margin: 0 auto;
      padding: calc(24px + env(safe-area-inset-top)) 24px
               calc(var(--tabs-h) + 24px + env(safe-area-inset-bottom));
    }
    .remote.active { display: flex; }
    .title {
      align-self: flex-start;
      font-size: 0.8rem; letter-spacing: 2px; color: var(--muted);
      text-transform: uppercase;
    }
    .row { display: flex; justify-content: space-between; width: 100%; }
    .row.center { justify-content: center; gap: 28px; }

    button {
      font: inherit; color: var(--text);
      background: var(--btn); border: none; cursor: pointer;
      transition: transform 0.08s, background 0.08s;
    }
    button:active { transform: scale(0.92); background: var(--btn-press); }

    .round {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .round svg { width: 26px; height: 26px; }
    .power { background: var(--power); }
    .power:active { background: #a52a2a; }

    /* ---------- D-pad ---------- */
    .dpad {
      position: relative; width: 230px; height: 230px;
      border-radius: 50%; background: var(--ring);
      border: 1px solid var(--line);
    }
    .dpad .arrow {
      position: absolute; width: 70px; height: 70px;
      background: transparent; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #bbb;
    }
    .dpad .arrow:active { background: var(--btn-press); }
    .dpad .arrow svg { width: 28px; height: 28px; }
    .up    { top: 4px;    left: 50%; transform: translateX(-50%); }
    .down  { bottom: 4px; left: 50%; transform: translateX(-50%); }
    .left  { left: 4px;   top: 50%;  transform: translateY(-50%); }
    .right { right: 4px;  top: 50%;  transform: translateY(-50%); }
    .up:active, .down:active { transform: translateX(-50%) scale(0.92); }
    .left:active, .right:active { transform: translateY(-50%) scale(0.92); }
    .ok {
      position: absolute; inset: 70px; border-radius: 50%;
      background: var(--ok); font-size: 1.05rem; letter-spacing: 1px;
    }
    .ok:active { background: #3a4d75; }

    /* ---------- Rocker (volume / brightness / color) ---------- */
    .rocker {
      display: flex; align-items: center; width: 100%; height: 60px;
      background: var(--btn); border-radius: 30px; overflow: hidden;
    }
    .rocker button {
      width: 76px; height: 100%; background: transparent;
      display: flex; align-items: center; justify-content: center;
    }
    .rocker button:active { background: var(--btn-press); transform: none; }
    .rocker button svg { width: 24px; height: 24px; }
    .rocker .label {
      flex: 1; text-align: center;
      font-size: 0.75rem; letter-spacing: 2px; color: var(--muted);
    }
    .rocker .mid {
      flex: 1; height: 100%; font-size: 0.75rem; letter-spacing: 2px; color: var(--muted);
      border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    }

    /* ---------- Color swatches ---------- */
    .swatches { display: grid; grid-template-columns: repeat(2, 78px); gap: 22px; }
    .swatch {
      width: 78px; height: 78px; border-radius: 50%;
      border: 4px solid var(--line);
    }
    .swatch:active { transform: scale(0.9); }
    .red   { background: #d33; }   .red:active   { background: #d33; }
    .green { background: #2b2; }   .green:active { background: #2b2; }
    .blue  { background: #36f; }   .blue:active  { background: #36f; }
    .white { background: #f2f2f2; } .white:active { background: #f2f2f2; }

    .pill {
      flex: 1; height: 52px; border-radius: 26px;
      font-size: 0.7rem; letter-spacing: 1px; color: var(--muted);
      white-space: nowrap; padding: 0 8px;
    }
    .pills { display: flex; gap: 14px; width: 100%; }

    /* ---------- Apps tab ---------- */
    .section-label {
      align-self: flex-start; margin-bottom: -8px;
      font-size: 0.7rem; letter-spacing: 2px; color: var(--muted);
    }
    .topbar { display: flex; align-items: center; gap: 14px; width: 100%; }
    .topbar .title { align-self: center; }
    .round.small { width: 44px; height: 44px; }
    .round.small svg { width: 22px; height: 22px; }
    .shortcut-btn {
      width: 100%; height: 56px; border-radius: 28px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 0.8rem; letter-spacing: 2px; color: var(--text);
    }
    .shortcut-btn svg { width: 22px; height: 22px; color: var(--accent); }
    .inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
    .input {
      height: 84px; border-radius: 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      font-size: 0.85rem;
    }
    .input svg { width: 24px; height: 24px; color: var(--muted); }
    .input span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .input small { font-size: 0.7rem; color: var(--muted); }
    .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
    .app {
      aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; padding: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; color: var(--muted);
    }
    .app img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ---------- Bottom tab bar ---------- */
    .tabs {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: calc(var(--tabs-h) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: #151518; border-top: 1px solid #2a2a2e;
      display: flex;
    }
    .tab {
      flex: 1; background: transparent; border-radius: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      font-size: 0.7rem; color: #777;
    }
    .tab:active { transform: none; background: transparent; }
    .tab svg { width: 26px; height: 26px; }
    .tab.on { color: var(--accent); }

    /* ---------- Status toast ---------- */
    #status {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(var(--tabs-h) + 14px + env(safe-area-inset-bottom));
      background: #333; padding: 10px 16px; border-radius: 20px;
      font-size: 0.85rem; opacity: 0; transition: opacity 0.2s;
      white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
      pointer-events: none;
    }
    #status.show { opacity: 1; }
    #status.err { background: #7a2a2a; }
  </style>
</head>
<body>

  <!-- Icons, defined once and reused -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 6a7.75 7.75 0 1 0 10 0"/><path d="M12 4v8"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H3l9-9 9 9h-2"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4-4 4-4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-rew" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M11 6L3 12l8 6z"/><path d="M21 6l-8 6 8 6z"/></symbol>
      <symbol id="i-ff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 6l8 6-8 6z"/><path d="M3 6l8 6-8 6z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5l9 7-9 7z"/><path d="M16 5v14M20 5v14" stroke-linecap="round"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"/><circle cx="16" cy="17" r="3"/><path d="M9 17V4h10v13M9 8h10"/></symbol>
      <symbol id="i-tv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M16 3l-4 4-4-4"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
      <symbol id="i-hdmi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v5l-2 3H5l-2-3z"/><path d="M8 11h8"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 16a5 5 0 1 1 6 0 3.5 3.5 0 0 0-1 3 2 2 0 0 1-4 0 3.5 3.5 0 0 0-1-3"/><path d="M9.7 17h4.6"/></symbol>
    </defs>
  </svg>

  <!-- ==================== TV REMOTE ==================== -->
  <section class="remote" id="remote-tv">
    <div class="title">TV · {{ tv_mode }}</div>

    <div class="row">
      <button class="round power" onclick="send('tv','power')" aria-label="Power"><svg><use href="#i-power"/></svg></button>
      <button class="round" onclick="send('tv','back')" aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <button class="round" onclick="send('tv','home')" aria-label="Home"><svg><use href="#i-home"/></svg></button>
    </div>

    <div class="row center">
      <button class="round small" onclick="send('tv','settings')" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
      <button class="round small" onclick="send('tv','sleep')" aria-label="Sleep timer"><svg><use href="#i-moon"/></svg></button>
    </div>

    <div class="dpad">
      <button class="arrow up"    onclick="send('tv','up')"    aria-label="Up"><svg><use href="#i-up"/></svg></button>
      <button class="arrow down"  onclick="send('tv','down')"  aria-label="Down"><svg><use href="#i-down"/></svg></button>
      <button class="arrow left"  onclick="send('tv','left')"  aria-label="Left"><svg><use href="#i-left"/></svg></button>
      <button class="arrow right" onclick="send('tv','right')" aria-label="Right"><svg><use href="#i-right"/></svg></button>
      <button class="ok" onclick="send('tv','ok')">OK</button>
    </div>

    <div class="row">
      <button class="round" onclick="send('tv','rewind')" aria-label="Rewind"><svg><use href="#i-rew"/></svg></button>
      <button class="round" onclick="send('tv','play')" aria-label="Play or pause"><svg><use href="#i-play"/></svg></button>
      <button class="round" onclick="send('tv','skip')" aria-label="Fast forward"><svg><use href="#i-ff"/></svg></button>
    </div>

    {% if tv_mode == "Wi-Fi" %}
    <div class="rocker">
      <button onclick="send('tv','vol_down')" aria-label="Volume down"><svg><use href="#i-minus"/></svg></button>
      <button class="mid" onclick="send('tv','mute')">MUTE</button>
      <button onclick="send('tv','vol_up')" aria-label="Volume up"><svg><use href="#i-plus"/></svg></button>
    </div>

    <button class="shortcut-btn" onclick="showRemote('shortcuts')"><svg><use href="#i-grid"/></svg>SHORTCUTS</button>
    {% endif %}
  </section>

  <!-- ==================== LED REMOTE ==================== -->
  <section class="remote" id="remote-led">
    <div class="title">Lights</div>

    <div class="row center">
      <button class="round power" onclick="send('led','power')" aria-label="Power"><svg><use href="#i-power"/></svg></button>
      <button class="round" onclick="send('led','sound_mode')" aria-label="Sound mode"><svg><use href="#i-music"/></svg></button>
    </div>

    <div class="rocker">
      <button onclick="send('led','dimmer')" aria-label="Dimmer"><svg><use href="#i-minus"/></svg></button>
      <div class="label">BRIGHTNESS</div>
      <button onclick="send('led','brighter')" aria-label="Brighter"><svg><use href="#i-plus"/></svg></button>
    </div>

    <div class="swatches">
      <button class="swatch red"   onclick="send('led','red')"   aria-label="Red"></button>
      <button class="swatch green" onclick="send('led','green')" aria-label="Green"></button>
      <button class="swatch blue"  onclick="send('led','blue')"  aria-label="Blue"></button>
      <button class="swatch white" onclick="send('led','white')" aria-label="White"></button>
    </div>

    <div class="rocker">
      <button onclick="send('led','prev_color')" aria-label="Previous color"><svg><use href="#i-left"/></svg></button>
      <div class="label">COLOR</div>
      <button onclick="send('led','next_color')" aria-label="Next color"><svg><use href="#i-right"/></svg></button>
    </div>

    <div class="pills">
      <button class="pill" onclick="send('led','dark_color')">DARKER COLORS</button>
      <button class="pill" onclick="send('led','bright_color')">BRIGHTER COLORS</button>
    </div>
  </section>

  <!-- ==================== SHORTCUTS (opened from the TV remote) ==================== -->
  {% if tv_mode == "Wi-Fi" %}
  <section class="remote" id="remote-shortcuts">
    <div class="topbar">
      <button class="round small" onclick="showRemote('tv')" aria-label="Back to TV remote"><svg><use href="#i-left"/></svg></button>
      <div class="title">Shortcuts</div>
    </div>

    <div class="section-label">INPUTS</div>
    <div class="inputs">
      {% for label, device, app_id in roku_inputs %}
      <button class="input" onclick="launch('{{ app_id }}', '{{ device }}')">
        <svg><use href="#i-hdmi"/></svg>
        <span>{{ label }}<small>{{ device }}</small></span>
      </button>
      {% endfor %}
    </div>

    <div class="section-label">APPS</div>
    <div class="apps">
      {% for label, app_id in roku_apps %}
      <button class="app" onclick="launch('{{ app_id }}', '{{ label }}')" aria-label="{{ label }}">
        <img src="/api/tv/icon/{{ app_id }}" alt="{{ label }}" loading="lazy"
             onerror="this.replaceWith(document.createTextNode('{{ label }}'))">
      </button>
      {% endfor %}
    </div>
  </section>
  {% endif %}

  <!-- ==================== TAB BAR ==================== -->
  <nav class="tabs">
    <button class="tab" data-remote="tv" onclick="showRemote('tv')"><svg><use href="#i-tv"/></svg>TV</button>
    <button class="tab" data-remote="led" onclick="showRemote('led')"><svg><use href="#i-bulb"/></svg>Lights</button>
  </nav>

  <div id="status"></div>

  <script>
    // ---------- Switching remotes (and remembering the last one) ----------
    function showRemote(name) {
      document.querySelectorAll('.remote').forEach(r =>
        r.classList.toggle('active', r.id === 'remote-' + name));
      // The shortcuts page belongs to the TV remote, so keep the TV tab lit
      const tab = name === 'shortcuts' ? 'tv' : name;
      document.querySelectorAll('.tab').forEach(t =>
        t.classList.toggle('on', t.dataset.remote === tab));
      try { localStorage.setItem('lastRemote', tab); } catch (e) {}
      window.scrollTo(0, 0);
    }

    let last = 'tv';
    try { last = localStorage.getItem('lastRemote') || 'tv'; } catch (e) {}
    if (!document.getElementById('remote-' + last)) last = 'tv';
    showRemote(last);

    // ---------- Feedback ----------
    function buzz() {
      // Works on Android. iPhones ignore it from web pages.
      if (navigator.vibrate) navigator.vibrate(15);
    }

    let timer;
    function show(msg, isErr) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'show' + (isErr ? ' err' : '');
      clearTimeout(timer);
      timer = setTimeout(() => el.className = '', isErr ? 2500 : 900);
    }

    // ---------- Sending ----------
    async function send(device, button) {
      buzz();
      try {
        const res = await fetch(`/api/${device}/${button}`, { method: 'POST' });
        const data = await res.json();
        data.ok ? show('Sent: ' + data.sent) : show(data.error, true);
      } catch (e) {
        show('Can\'t reach the Pi', true);
      }
    }

    async function launch(appId, label) {
      buzz();
      try {
        const res = await fetch(`/api/tv/launch/${encodeURIComponent(appId)}`, { method: 'POST' });
        const data = await res.json();
        data.ok ? show('Opening ' + label) : show(data.error, true);
      } catch (e) {
        show('Can\'t reach the Pi', true);
      }
    }
  </script>
</body>
</html>
